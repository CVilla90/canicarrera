<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canicarrera — 3D marble race</title>
<style>
  :root {
    --ink: #070b16;
    --glass: rgba(13, 20, 36, 0.72);
    --edge: rgba(120, 180, 255, 0.14);
    --text: #e8eef8;
    --dim: #7d8aa5;
    --cyan: #37e0ff;
    --gold: #ffc23d;
    --display: "Bahnschrift", "Arial Narrow", "Segoe UI", sans-serif;
    --mono: "Consolas", "Cascadia Mono", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--ink); }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: var(--text); }
  canvas { display: block; }

  .panel {
    position: fixed;
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 10px;
    backdrop-filter: blur(10px);
  }

  /* wordmark */
  #title-card { top: 18px; left: 18px; padding: 12px 18px 10px; }
  #title-card h1 {
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 3px;
    color: var(--text);
  }
  #title-card h1 em { font-style: italic; color: var(--cyan); }
  #title-card p {
    font-family: var(--display);
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--dim);
    margin-top: 2px;
  }
  #clock {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--gold);
    margin-top: 7px;
  }

  /* timing tower */
  #board {
    top: 18px; right: 18px;
    width: 208px;
    list-style: none;
    padding: 10px 12px;
  }
  #board li { padding: 5px 2px 7px; position: relative; }
  #board li + li { border-top: 1px solid rgba(255,255,255,0.05); }
  #board .row { display: flex; align-items: baseline; gap: 8px; }
  #board .pos {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    width: 14px;
  }
  #board .name {
    font-family: var(--display);
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    flex: 1;
  }
  #board .val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }
  #board .val.done { color: var(--gold); }
  #board .bar {
    height: 2px;
    border-radius: 1px;
    margin-top: 5px;
    transition: width 0.2s linear;
  }

  /* center status: countdown / winner banner */
  #status {
    position: fixed;
    top: 26%;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    font-size: 88px;
    letter-spacing: 4px;
    pointer-events: none;
    text-shadow: 0 0 34px rgba(55, 224, 255, 0.45), 0 4px 24px rgba(0,0,0,0.6);
    transition: opacity 0.4s;
  }
  #status.small { font-size: 44px; }

  /* results */
  #results {
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    padding: 22px 30px 24px;
    min-width: 280px;
    text-align: center;
  }
  #results h2 {
    font-family: var(--display);
    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
  }
  #results ol { list-style: none; text-align: left; }
  #results li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 4px 0;
    font-family: var(--display);
    font-size: 15px;
    letter-spacing: 1px;
  }
  #results .pos { font-family: var(--mono); font-size: 12px; color: var(--dim); width: 16px; }
  #results .t { font-family: var(--mono); font-size: 13px; color: var(--dim); margin-left: auto; }
  #results li:first-child .t { color: var(--gold); }

  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }

  /* controls */
  #controls { position: fixed; bottom: 18px; right: 18px; display: flex; gap: 10px; }
  #controls button {
    font-family: var(--display);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text);
    background: var(--glass);
    border: 1px solid var(--edge);
    border-radius: 999px;
    padding: 10px 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
  }
  #controls button:hover { border-color: var(--cyan); color: var(--cyan); }
  #controls button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .hidden { display: none !important; }

  @media (max-width: 640px) {
    #board { width: 158px; }
    #status { font-size: 54px; }
    #status.small { font-size: 30px; }
  }
</style>

<div id="title-card" class="panel">
  <h1>CANICA<em>RRERA</em></h1>
  <p>marble race &middot; proof of concept</p>
  <div id="clock">0.0 s</div>
</div>

<ol id="board" class="panel"></ol>

<div id="status"></div>

<div id="results" class="panel hidden">
  <h2>Final classification</h2>
  <ol id="results-list"></ol>
</div>

<div id="controls">
  <button id="btn-race" type="button">&#8635; New race</button>
  <button id="btn-track" type="button">&#9968; New track</button>
</div>

<script src="vendor/three.min.js"></script>
<script src="main.js"></script>
